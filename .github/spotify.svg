<svg xmlns="http://www.w3.org/2000/svg" width="450" height="106" viewBox="0 0 450 106" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #8B949E; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1DB954; text-transform: uppercase; letter-spacing: 0.5px; }
    .bar { animation: sound 1.4s ease-in-out infinite alternate; fill: #1DB954; }
    .bar:nth-child(1) { animation-delay: 0.1s; }
    .bar:nth-child(2) { animation-delay: 0.4s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.5s; }
    .bar:nth-child(5) { animation-delay: 0.3s; }
    @keyframes sound {
      0% { height: 4px; y: 64px; }
      100% { height: 26px; y: 42px; }
    }
  </style>

  <!-- Card Background -->
  <rect width="450" height="106" rx="12" fill="#141321" stroke="#2c2b3e" stroke-width="1.5" />

  <!-- Spotify Vinyl / Album Cover Placeholder -->
  <g transform="translate(18, 18)">
    <rect width="70" height="70" rx="8" fill="#0D1117" stroke="#30363D" />
    <!-- Vinyl Disc Groove circles -->
    <circle cx="35" cy="35" r="28" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="20" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- Spotify Logo Center -->
    <circle cx="35" cy="35" r="11" fill="#1DB954" />
    <path d="M31.2 32.2c2.8-.7 5.8-.5 8.2.8.3.2.4.5.2.8-.2.3-.5.4-.8.2-2.1-1.1-4.7-1.3-7.2-.7-.3.1-.6-.1-.7-.4-.1-.3.1-.6.4-.7zm-.5 3c2.4-.6 5-.4 7 .7.2.1.3.5.2.7-.1.2-.4.3-.7.2-1.7-.9-4-1.1-6.1-.5-.3.1-.5-.1-.6-.3-.1-.3.1-.6.4-.7zm.2 3.1c1.9-.4 3.9-.3 5.5.5.2.1.3.4.2.6-.1.2-.4.3-.6.2-1.4-.7-3.1-.8-4.7-.4-.2.1-.5-.1-.5-.3 0-.2.1-.5.4-.6z" fill="#0D1117"/>
  </g>

  <!-- Playlist Metadata -->
  <g transform="translate(104, 24)">
    <!-- Category Tag -->
    <text x="0" y="8" class="badge">Playlist on Spotify</text>
    <!-- Playlist Name -->
    <text x="0" y="32" class="title">Back in Black</text>
    <!-- Description / Creator -->
    <text x="0" y="52" class="subtitle">Plot Armor • Curated by Acel</text>
  </g>

  <!-- Animated Sound Equalizer Waves -->
  <g transform="translate(390, 0)">
    <rect class="bar" x="0" y="50" width="3.5" height="14" rx="1.75" />
    <rect class="bar" x="7" y="44" width="3.5" height="20" rx="1.75" />
    <rect class="bar" x="14" y="56" width="3.5" height="10" rx="1.75" />
    <rect class="bar" x="21" y="46" width="3.5" height="18" rx="1.75" />
    <rect class="bar" x="28" y="52" width="3.5" height="12" rx="1.75" />
  </g>
</svg>
