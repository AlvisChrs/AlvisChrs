name: Generate Snake Contribution Grid

on:
  schedule:
    # Run every 12 hours automatically
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AlvisChrs
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f87171&color_dots=#ebedf0,#ffcdd2,#ef9a9a,#e57373,#ef4444
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f87171&color_dots=#161b22,#5c1d24,#8c2530,#bd2d3c,#f87171

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
